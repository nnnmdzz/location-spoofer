name: Build and Release IPA

on:
  push:
    branches:
      - 'release/v1.0.2-0002'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA and run tests
        run: ./build.sh --test

      - name: Rename IPA for release
        run: mv dist/PaopaoLocationSpoofer-unsigned.ipa dist/Location-Spoofer-v1.0.2-0002-unsigned.ipa

      - name: Validate archived release notes
        run: |
          NOTES_FILE="docs/releases/v1.0.2-0002.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::缺少版本归档 $NOTES_FILE"
            exit 1
          fi
          if ! grep -Fq "# v1.0.2-0002" "$NOTES_FILE"; then
            echo "::error::$NOTES_FILE 的标题必须包含 # v1.0.2-0002"
            exit 1
          fi
          cp "$NOTES_FILE" /tmp/release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.2-0002"
          target_commitish: "${{ github.sha }}"
          name: "v1.0.2-0002"
          body_path: /tmp/release_notes.md
          files: dist/Location-Spoofer-v1.0.2-0002-unsigned.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
