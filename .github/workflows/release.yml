name: Build and Release IPA

on:
  push:
    branches:
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v1.0.5-0005'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          case "$VERSION" in
            v*) ;;
            *) VERSION="v${VERSION}" ;;
          esac
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9]{4})?$ ]]; then
            echo "::error::无效发行版本: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=Location-Spoofer-${VERSION}-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          NOTES_FILE="docs/releases/${VERSION}.md"
          RELEASE_NOTES="/tmp/release_notes.md"

          if [ -s "$NOTES_FILE" ]; then
            if ! grep -Fq "# ${VERSION}" "$NOTES_FILE"; then
              echo "::error::$NOTES_FILE 的标题必须包含 # ${VERSION}"
              exit 1
            fi
            cp "$NOTES_FILE" "$RELEASE_NOTES"
            echo "Using archived release notes: $NOTES_FILE"
          else
            echo "::notice::未找到 $NOTES_FILE；根据 Git 历史自动生成本次 Release 说明。"
            RELEASE_DATE="$(date +%F)" \
              bash Scripts/generate-release-notes.sh "$VERSION" "$RELEASE_NOTES" "$GITHUB_SHA"
          fi

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: ./build.sh

      - name: Run iOS Simulator unit tests
        run: bash Scripts/run-simulator-tests.sh

      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics-${{ github.run_id }}
          path: build/TestResults
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename IPA for release
        run: mv dist/PaopaoLocationSpoofer-unsigned.ipa "dist/${{ steps.release.outputs.asset }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release.outputs.version }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ steps.release.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: "dist/${{ steps.release.outputs.asset }}"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
