name: Validate Development

on:
  push:
    branches:
      - 'sync/**'
      - 'feature/**'
      - develop
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run shell contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in Tests/*_test.sh; do
            echo "Running ${test_file}"
            bash "${test_file}"
          done

      - name: Run Core Go tests
        working-directory: Core
        run: go test ./...

      - name: Run WLOC script tests
        working-directory: ThirdParty/WlocScripts
        run: |
          npm ci
          npm test

      - name: Build Device Release
        run: ./build.sh

      - name: Start available iOS Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          echo "destination=platform=iOS Simulator,id=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        env:
          SIMULATOR_DESTINATION: ${{ steps.simulator.outputs.destination }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          rm -rf /tmp/LocationSpooferTests.xcresult /tmp/xctest.log
          xcodebuild \
            -project PaopaoLocationSpoofer.xcodeproj \
            -scheme PaopaoLocationSpoofer \
            -destination "$SIMULATOR_DESTINATION" \
            -destination-timeout 120 \
            -resultBundlePath /tmp/LocationSpooferTests.xcresult \
            test 2>&1 | tee /tmp/xctest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "===== XCTest result summary ====="
            if [ -d /tmp/LocationSpooferTests.xcresult ]; then
              xcrun xcresulttool get test-results summary --path /tmp/LocationSpooferTests.xcresult || true
            fi
            echo "===== XCTest diagnostic lines ====="
            python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/xctest.log')
          lines = path.read_text(errors='replace').splitlines() if path.exists() else []
          needles = (
              ' error:', 'error: ', ' failed', 'failed ', 'failure', 'XCTAssert',
              'Test Case', 'Test Suite', 'Testing failed', 'Failing tests',
              'Could not', 'Unable to', 'terminated', 'crash'
          )
          matches = [line for line in lines if any(needle.lower() in line.lower() for needle in needles)]
          for line in matches[-80:]:
              print(line)
          for line in matches[-12:]:
              escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=iOS XCTest::{escaped}')
          PY
          fi
          exit "$status"
