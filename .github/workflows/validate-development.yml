name: Validate Development

on:
  push:
    branches:
      - 'sync/**'
      - 'feature/**'
      - develop
  pull_request:
    branches:
      - develop

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64]
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install XcodeGen
        # The runner is a machine, not a fresh image: installing something already present is a
        # slow way to fail when Homebrew decides to upgrade itself mid-run.
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Run shell contract tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in Tests/*_test.sh; do
            echo "Running ${test_file}"
            bash "${test_file}"
          done

      - name: Run Core Go tests
        working-directory: Core
        run: go test ./...

      - name: Run WLOC script tests
        working-directory: ThirdParty/WlocScripts
        run: |
          npm ci
          npm test

      - name: Build Device Release
        run: ./build.sh

      - name: Run iOS Simulator unit tests
        run: bash Scripts/run-simulator-tests.sh

      - name: Upload iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics-${{ github.run_id }}
          path: build/TestResults
          if-no-files-found: ignore
          retention-days: 7
