name: PaopaoLocationSpoofer
options:
  bundleIdPrefix: com.paopaolabs
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "12"
    FORK_RELEASE_VERSION: "1.0.5-0006"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

packages:
  # Pinned exactly, not with a range: self-update is how this fork ships, and a dependency that
  # drifts on its own could break the one mechanism that would otherwise deliver the fix.
  PrivateSigner:
    url: https://github.com/nnnmdzz/private-signer-ios.git
    exactVersion: 0.2.0

targets:
  PaopaoLocationSpoofer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - package: PrivateSigner
        product: PrivateSignerKit
      - package: PrivateSigner
        product: PrivateSignerSelfUpdate
      - package: PrivateSigner
        product: PrivateSignerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paopaolabs.location-spoofer
        PRODUCT_NAME: PaopaoLocationSpoofer
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PaopaoLocationSpoofer.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lwloccore"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Core/build/$(PLATFORM_NAME)"

  PaopaoLocationSpooferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PaopaoLocationSpooferTests
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
    dependencies:
      - target: PaopaoLocationSpoofer

schemes:
  PaopaoLocationSpoofer:
    build:
      targets:
        PaopaoLocationSpoofer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaopaoLocationSpooferTests
    archive:
      config: Release
