name: PaopaoLocationSpoofer
options:
  bundleIdPrefix: com.paopaolabs
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.5"
    CURRENT_PROJECT_VERSION: "14"
    FORK_RELEASE_VERSION: "1.0.5-0009"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

packages:
  # v3 is a breaking bug-fix contract. Pin the exact merged SDK revision until the same commit can
  # be published as the 0.3.0 tag; never float self-update code on a version range.
  PrivateSigner:
    url: https://github.com/nnnmdzz/private-signer-ios.git
    revision: e54fc2bbfcfb2c38d7e18d154e6aeb1a4ea78bd6

targets:
  PaopaoLocationSpoofer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - package: PrivateSigner
        product: PrivateSignerKit
      - package: PrivateSigner
        product: PrivateSignerSelfUpdate
      - package: PrivateSigner
        product: PrivateSignerUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paopaolabs.location-spoofer
        PRODUCT_NAME: PaopaoLocationSpoofer
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/PaopaoLocationSpoofer.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -lwloccore"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Core/build/$(PLATFORM_NAME)"

  PaopaoLocationSpooferTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PaopaoLocationSpooferTests
    settings:
      base:
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/PaopaoLocationSpoofer-Bridging-Header.h
    dependencies:
      - target: PaopaoLocationSpoofer

schemes:
  PaopaoLocationSpoofer:
    build:
      targets:
        PaopaoLocationSpoofer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PaopaoLocationSpooferTests
    archive:
      config: Release
